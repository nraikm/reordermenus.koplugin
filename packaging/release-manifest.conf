# ---------------------------------------------------------------------------
# release-manifest.conf — authoritative release content manifest
#
# Sourced by build_release.sh. Categories:
#
#   REQUIRED_RUNTIME      plugin cannot execute without these; every entry MUST
#                         be tracked in git and reachable via require()/loader
#   OPTIONAL_DISTRIBUTABLE shipped when tracked, skipped silently otherwise
#   DEV_ONLY_PATTERNS     tracked files that must NEVER enter the archive
#                         (glob patterns matched with shell case)
#
# Anything tracked that falls into NEITHER category fails the build until it
# is consciously categorized here. This is deliberate: new runtime modules
# must be registered, never assumed.
#
# Naming rule: every plugin-local Lua module carries the reorderingmenus_
# prefix (unique package.loaded keys; flat single-segment names verified
# against KOReader pluginloader's "%s/?.lua" package.path template).
# main.lua and _meta.lua are the plugin-loader contract names and keep theirs.
# ---------------------------------------------------------------------------

REQUIRED_RUNTIME="
main.lua
_meta.lua
reorderingmenus_atomic_writer.lua
reorderingmenus_commit_pipeline.lua
reorderingmenus_data_loader.lua
reorderingmenus_ghost_gc.lua
reorderingmenus_intent_store.lua
reorderingmenus_koreader_adapter.lua
reorderingmenus_materializer.lua
reorderingmenus_menu_schema.lua
reorderingmenus_menu_titles.lua
reorderingmenus_menuorder_manager.lua
reorderingmenus_native_writer.lua
reorderingmenus_plugin_prefs.lua
reorderingmenus_presets.lua
reorderingmenus_registry.lua
reorderingmenus_semantic_diff.lua
reorderingmenus_ui_compat.lua
reorderingmenus_ui_editor_model.lua
reorderingmenus_ui_editor_registry.lua
reorderingmenus_ui_screens.lua
reorderingmenus_unicode_fold.lua
reorderingmenus_validator.lua
"

OPTIONAL_DISTRIBUTABLE="
# Non-runtime assets that may be omitted from a minimal installation.
README.md
screenshots/01-menu-order.png
screenshots/02-submenu-order.png
screenshots/03-submenu-actions.png
screenshots/04-submenu-presets.png
"

DEV_ONLY_PATTERNS="
.gitignore
run_tests.sh
build_release.sh
packaging/*
tests/*
docs/*
patches/*
.commandcode/*
scripts/*
COORDINATION.md
CHANGE_SUMMARY.md
REFERENCE_SEMANTICS.md
fix_probe*.py
*.log
*.corrupt-*
"
