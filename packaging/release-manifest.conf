# ---------------------------------------------------------------------------
# release-manifest.conf — authoritative release content manifest
#
# Sourced by build_release.sh. Categories:
#
#   REQUIRED_RUNTIME      plugin cannot execute without these; every entry MUST
#                         be tracked in git and reachable via require()/loader
#   OPTIONAL_DISTRIBUTABLE shipped when tracked, skipped silently otherwise
#   DEV_ONLY_PATTERNS     tracked files that must NEVER enter the archive
#                         (glob patterns matched with shell case)
#
# Anything tracked that falls into NEITHER category fails the build until it
# is consciously categorized here. This is deliberate: new runtime modules
# must be registered, never assumed.
#
# Naming rule: plugin-local Lua modules live under lib/ and are required
# with dotted lib.* names, resolved through KOReader pluginloader's
# "%s/?.lua" package.path template (lib.<name> -> lib/<name>.lua).
# main.lua and _meta.lua are the plugin-loader contract names and keep
# theirs at the plugin root.
# ---------------------------------------------------------------------------

REQUIRED_RUNTIME="
main.lua
_meta.lua
lib/atomic_writer.lua
lib/commit_pipeline.lua
lib/data_loader.lua
lib/ghost_gc.lua
lib/intent_store.lua
lib/koreader_adapter.lua
lib/materializer.lua
lib/menu_schema.lua
lib/menu_titles.lua
lib/menuorder_manager.lua
lib/native_writer.lua
lib/placement.lua
lib/plugin_prefs.lua
lib/presets.lua
lib/registry.lua
lib/semantic_diff.lua
lib/ui_compat.lua
lib/ui_editor_model.lua
lib/ui_editor_registry.lua
lib/ui_screens.lua
lib/unicode_fold.lua
lib/validator.lua
lib/visibility.lua
"

# Bare-name requires provided by KOReader rather than this plugin. Modules
# containing slashes are already excluded by build_release.sh's local scan.
EXTERNAL_BARE_MODULES="
bit
datastorage
device
dump
gettext
logger
luadefaults
luasettings
main
random
util
"

OPTIONAL_DISTRIBUTABLE="
# Non-runtime assets that may be omitted from a minimal installation.
README.md
screenshots/01-menu-order.png
screenshots/02-submenu-order.png
screenshots/03-submenu-actions.png
screenshots/04-submenu-presets.png
"

DEV_ONLY_PATTERNS="
.gitignore
run_tests.sh
build_release.sh
packaging/*
tests/*
docs/*
patches/*
.commandcode/*
scripts/*
fix_probe*.py
*.log
*.corrupt-*
CHANGE_SUMMARY.md
COORDINATION.md
REFERENCE_SEMANTICS.md
"
